<html lang="es">
<head>

    <title>Nico perro</title>
    <style>
        /* Hacemos que el body ocupe toda la pantalla y usamos Flexbox para centrar */
        body {
            height: 100vh;

            justify-content: center;
            align-items: center;
            background-color: blue ;
            font-family: Arial, sans-serif;
        }

        /* Estilos de la tarjeta */
        .card {

            padding: 30px;

            text-align: center;
        }

        /* Estilos del mensaje */
        .card p {
            margin: 0;
            color: #333;
            font-size: 20px;

        }
    </style>
</head>
<body>
